[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
# Test runner only: exhaustive coalition tests exceed the default limit.
gas_limit = 9000000000000
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
gas_reports = ["CredentialRegistry"]
fs_permissions = [{ access = "read-write", path = "./data" }]

[fuzz]
runs = 256
seed = "0x435"

[fmt]
line_length = 120
